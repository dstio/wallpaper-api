// Colour Fields: the sample wallpaper plugin. Soft gradients made on the device, served through
// wallpaper-api. Debug builds only (debug signing); never published.

plugins {
    id 'com.android.application'
}

android {
    namespace 'ca.dstudio.atvlauncher.wallpaper.sample.colourfields'
    compileSdkVersion ANDROID_COMPILE_SDK_VERSION
    defaultConfig {
        applicationId 'ca.dstudio.atvlauncher.wallpaper.sample.colourfields'
        minSdkVersion ANDROID_MIN_SDK_VERSION
        targetSdkVersion ANDROID_COMPILE_SDK_VERSION
        versionCode 1
        versionName '1.0'
        // In the app's own process the service's caller check passes, so a test can drive it.
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures {
        // BuildConfig.DEBUG gates the test switches.
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)
    }
}

dependencies {
    implementation project(':wallpaper-api')

    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
